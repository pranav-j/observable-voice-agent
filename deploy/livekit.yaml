# LiveKit server on the demo instance. Keys come from LIVEKIT_KEYS in the environment.
port: 7880

rtc:
  tcp_port: 7881
  # One muxed UDP port: the security group opens just this one for media.
  udp_port: 7882
  # Find the instance's public address over STUN, so browsers are told the right one.
  use_external_ip: true

logging:
  level: info
