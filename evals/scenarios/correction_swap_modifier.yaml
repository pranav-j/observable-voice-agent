id: correction_swap_modifier
description: Caller replaces one modifier with another on an item already added.
tags: [correction, modifier]
runs: 3
persona:
  name: Kavya
  style: hesitant
  voice: voice_pool.female_1
goal: >
  Order one small cafe latte with oat milk. Right after it is added, change
