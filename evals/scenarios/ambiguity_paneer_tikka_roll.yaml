id: ambiguity_paneer_tikka_roll
description: Caller says "paneer tikka" but means the roll, and corrects it at the read-back.
tags: [ambiguity, confusable]
runs: 3
persona:
  name: Gaurav
  style: brisk
  voice: voice_pool.male_2
goal: >
  You want one paneer tikka roll, but you just call it "paneer tikka". If they
