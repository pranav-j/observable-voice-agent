id: correction_phone_fix
description: Caller gives a wrong phone number, then corrects it when it is read back.
tags: [correction, phone]
runs: 3
persona:
  name: Imran
  style: brisk
  voice: voice_pool.male_2
goal: >
  Order one paneer tikka roll. When asked for your phone number, say
  9000000019 by mistake. When the order-taker reads the number back, correct
  it: the right number is 9000000009.
customer: {name: Imran, phone: "9000000009"}
expect:
  status: confirmed
  order:
    items:
      - {item: paneer_tikka_roll, quantity: 1, modifiers: []}
    customer: {name: Imran, phone: "9000000009"}
