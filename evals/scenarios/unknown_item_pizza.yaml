id: unknown_item_pizza
description: Caller asks for something not on the menu, then orders something that is.
tags: [out_of_stock, unknown_item]
runs: 3
persona:
  name: Rahul
  style: confused
  voice: voice_pool.male_2
goal: >
  Ask for a margherita pizza. When you're told it isn't on the menu, order one
  veg club sandwich instead.
customer: {name: Rahul, phone: "9000081321"}
expect:
  status: confirmed
  order:
    items:
      - {item: veg_club_sandwich, quantity: 1, modifiers: []}
    customer: {name: Rahul, phone: "9000081321"}
